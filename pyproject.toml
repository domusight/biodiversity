[project]
name = "biodiversity-potential"
version = "0.1.0"
description = "Urban biodiversity potential for a small area, as a QGIS plugin and a tested Python model."
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["qgis", "examples/riverside_quarter", "web"]
testpaths = ["tests"]

[tool.setuptools]
packages = ["biodiversity_potential"]

[tool.setuptools.package-dir]
biodiversity_potential = "qgis/biodiversity_potential"

[tool.setuptools.package-data]
biodiversity_potential = ["*.txt", "*.png", "style/*.qml"]
